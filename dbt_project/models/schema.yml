version: 2

sources:
  - name: raw
    description: Raw data loaded from the generator's JSON files by ingestion/load_to_duckdb.py
    schema: main
    tables:
      - name: raw_customers
        columns:
          - name: customer_id
            data_tests:
              - unique
              - not_null
      - name: raw_plans
      - name: raw_subscriptions
        columns:
          - name: subscription_id
            data_tests:
              - unique
              - not_null
      - name: raw_subscription_events
      - name: raw_invoices

models:
  - name: stg_customers
    description: One row per customer, lightly typed from the raw table.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_plans
    description: The three plans and their monthly and annual prices.
    columns:
      - name: plan_id
        data_tests:
          - unique
          - not_null

  - name: stg_subscriptions
    description: >
      SCD2 subscription versions. Each row is one plan period for one customer;
      status is 'canceled' only on a customer's final version when they churned.
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: plan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'canceled']

  - name: stg_subscription_events
    description: Signup, upgrade, downgrade and cancel events, keyed to the subscription version they created or ended.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['signup', 'upgrade', 'downgrade', 'cancel']

  - name: stg_invoices
    description: Monthly invoices per subscription version.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'failed', 'refunded']

  - name: int_subscriptions_history
    description: Subscription versions joined to plan name and price. The base for every MRR calculation.
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: plan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_id

  - name: dim_customers
    description: Customer dimension with signup cohort month and churn status.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: customer_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'churned']

  - name: fct_invoices
    description: Invoice facts with customer and plan context.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_subscriptions_history')
                field: subscription_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: mart_mrr
    description: MRR at the end of each month by plan and region. A snapshot, so never sum it across months.
    columns:
      - name: month
        data_tests:
          - not_null
      - name: plan_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Starter', 'Pro', 'Enterprise']
      - name: total_mrr
        data_tests:
          - not_null

  - name: mart_mrr_movements
    description: Monthly MRR bridge. new + expansion + contraction + churned equals net new MRR.
    columns:
      - name: month
        data_tests:
          - unique
          - not_null
      - name: ending_mrr
        data_tests:
          - not_null

  - name: mart_churn
    description: Cancellations by month and plan, with average days from signup to cancel.
    columns:
      - name: churn_month
        data_tests:
          - not_null
      - name: plan_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['Starter', 'Pro', 'Enterprise']

  - name: mart_cohort_retention
    description: For each signup cohort and each month after signup, how many customers were still active.
    columns:
      - name: cohort_month
        data_tests:
          - not_null
      - name: active_month
        data_tests:
          - not_null
      - name: retention_pct
        data_tests:
          - not_null
