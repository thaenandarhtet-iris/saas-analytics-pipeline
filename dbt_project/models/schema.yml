version: 2

sources:
  - name: raw
    description: Raw data from Python generation script
    tables:
      - name: customers
        description: Customer master data
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
      
      - name: plans
        description: Subscription plan definitions
        columns:
          - name: plan_id
            description: Unique plan identifier
            tests:
              - unique
              - not_null
      
      - name: subscriptions
        description: Subscription records (SCD2 ready)
        columns:
          - name: subscription_id
            description: Unique subscription identifier
            tests:
              - unique
              - not_null
      
      - name: subscription_events
        description: Subscription lifecycle events
        columns:
          - name: event_id
            description: Unique event identifier
            tests:
              - unique
              - not_null
      
      - name: invoices
        description: Invoice records
        columns:
          - name: invoice_id
            description: Unique invoice identifier
            tests:
              - unique
              - not_null

models:
  - name: stg_customers
    description: Staged customer data, cleaned
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  
  - name: dim_customers
    description: Customer dimension with cohort
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
